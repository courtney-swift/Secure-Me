<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SecureMe | Delete Account</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand fw-bold" href="{% url 'home' %}">
                SecureMe
            </a>

        </div>

    </nav>

    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-7">

                <div class="card shadow-sm border-0">

                    <div class="card-body p-4">

                        <h2 class="text-danger">
                            Delete Security Account
                        </h2>

                        <p class="mt-3">
                            Are you sure you want to delete
                            <strong>{{ account.account_name }}</strong>?
                        </p>

                        <div class="alert alert-warning">
                            This action cannot be undone.
                            Only the SecureMe tracking record
                            will be deleted, not your external account.
                        </div>

                        <form method="POST">

                            {% csrf_token %}

                            <button type="submit"
                                    class="btn btn-danger w-100">
                                Yes, Delete Account
                            </button>

                        </form>

                        <a href="{% url 'account_detail' account.id %}" class="btn btn-outline-secondary w-100 mt-3">
                            Cancel
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </main>

</body>
</html>
